name: CI

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run experiment checks
        run: |
          failed=0
          for check in experiments/*/check.sh; do
            [ -e "$check" ] || continue
            dir=$(dirname "$check")
            echo "::group::$dir"
            if (cd "$dir" && bash ./check.sh); then
              echo "pass: $dir"
            else
              echo "::error::check failed in $dir"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
